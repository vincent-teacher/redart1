<!DOCTYPE html>

<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>

    <symbol id="i-heart-o" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.4C1.4 7.6 3.8 4 7.4 4c2 0 3.5 1.1 4.6 2.7C13.1 5.1 14.6 4 16.6 4c3.6 0 6 3.6 4.7 7.1-1.8 4.8-9.3 9.4-9.3 9.4z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>

    <symbol id="i-card" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="15" height="11" rx="1.5" transform="rotate(-6 10 12)"/><rect x="7" y="8" width="14" height="10" rx="1.5"/></g></symbol>

    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2.8 2.8 6 6.4.6-4.9 4.3 1.5 6.4L12 16.8l-5.8 3.3 1.5-6.4-4.9-4.3 6.4-.6z" fill="currentColor"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m5 15 7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<canvas id="petals" aria-hidden="true"></canvas>

<header class="topbar" id="topbar">
  <a class="brand" href="#/" data-snd="click">
    <img src="assets/校徽.jpg" alt="國立楊梅高級中學校徽" class="brand-badge">
    <img src="assets/logo.svg" alt="紅土藝術空間 Logo" class="brand-logo">
    <span class="brand-text"><b>楊梅高中</b><span>紅土藝術空間</span></span>
  </a>
  <nav class="mainnav" id="mainnav" aria-label="主選單">
    <a href="#/" data-view="home"><svg><use href="#i-home"/></svg><span>首頁</span></a>
    <a href="#/browse" data-view="browse"><svg><use href="#i-grid"/></svg><span>展覽瀏覽</span></a>
    <a href="#/timeline" data-view="timeline"><svg><use href="#i-time"/></svg><span>年代長廊</span></a>
    <a href="#/search" data-view="search"><svg><use href="#i-search"/></svg><span>檢索</span></a>
    <a href="#/tour" data-view="tour"><svg><use href="#i-play"/></svg><span>展場漫遊</span></a>
    <a href="#/game" data-view="game"><svg><use href="#i-game"/></svg><span>翻牌遊戲</span></a>
    <a href="#/fav" data-view="fav"><svg><use href="#i-heart"/></svg><span>我的收藏</span></a>
    <a href="#/about" data-view="about"><svg><use href="#i-info"/></svg><span>關於紅土</span></a>
  </nav>
  <div class="tools">
    <form class="quicksearch" id="quicksearch" role="search">
      <svg><use href="#i-search"/></svg>
      <input type="search" id="qs-input" placeholder="搜尋展名、藝術家、海報文字…" aria-label="快速搜尋">
    </form>
    <button class="iconbtn" id="btn-sound" title="音效開關" aria-label="音效開關"><svg><use href="#i-sound"/></svg></button>
    <button class="iconbtn" id="btn-settings" title="設定" aria-label="設定"><svg><use href="#i-gear"/></svg></button>
    <button class="iconbtn menu-toggle" id="btn-menu" aria-label="選單" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <img src="assets/校徽.jpg" alt="">
      <img src="assets/logo.svg" alt="">
      <div>
        <b>國立楊梅高級中學・紅土藝術空間</b>
        <p>座落於啟明樓四樓・民國 97 年 5 月 9 日落成啟用</p>
      </div>
    </div>
    <p class="footer-meta" id="footer-meta"></p>
  </div>
</footer>

<button class="totop" id="totop" aria-label="回到頁首"><svg><use href="#i-up"/></svg></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 燈箱 -->
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="圖片檢視">
  <div class="lb-stage" id="lb-stage"><img id="lb-img" alt=""></div>
  <div class="lb-top">
    <div class="lb-title" id="lb-title"></div>
    <div class="lb-btns">
      <button class="iconbtn light" id="lb-zout" aria-label="縮小"><svg><use href="#i-zout"/></svg></button>
      <span class="lb-zoom" id="lb-zoom">100%</span>
      <button class="iconbtn light" id="lb-zin" aria-label="放大"><svg><use href="#i-zin"/></svg></button>
      <button class="iconbtn light" id="lb-flip" aria-label="翻面" title="翻到另一面"><svg><use href="#i-flip"/></svg></button>
      <button class="iconbtn light" id="lb-full" aria-label="全螢幕"><svg><use href="#i-full"/></svg></button>
      <button class="iconbtn light" id="lb-close" aria-label="關閉"><svg><use href="#i-close"/></svg></button>
    </div>
  </div>
  <button class="lb-nav prev" id="lb-prev" aria-label="上一張"><svg><use href="#i-left"/></svg></button>
  <button class="lb-nav next" id="lb-next" aria-label="下一張"><svg><use href="#i-right"/></svg></button>
  <div class="lb-strip" id="lb-strip"></div>
</div>

<!-- 設定 -->
<div class="drawer-mask" id="drawer-mask" hidden></div>
<aside class="drawer" id="settings" aria-label="設定" hidden>
  <div class="drawer-head"><h2>顯示與音效設定</h2><button class="iconbtn" id="settings-close" aria-label="關閉"><svg><use href="#i-close"/></svg></button></div>
  <div class="setting">
    <label>文字大小</label>
    <div class="seg" id="set-font">
      <button data-v="16">小</button><button data-v="18">標準</button><button data-v="20">大</button><button data-v="23">特大</button>
    </div>
  </div>
  <div class="setting row"><label for="set-sound">介面音效</label><input type="checkbox" class="switch" id="set-sound"></div>
  <div class="setting"><label for="set-vol">音量</label><input type="range" id="set-vol" min="0" max="100"></div>
  <div class="setting row"><label for="set-music">背景音樂（輕柔環境音）</label><input type="checkbox" class="switch" id="set-music"></div>
  <div class="setting row"><label for="set-anim">動畫效果</label><input type="checkbox" class="switch" id="set-anim"></div>
  <div class="setting row"><label for="set-petals">飄落梅花</label><input type="checkbox" class="switch" id="set-petals"></div>
  <div class="setting">
    <label>主題色調</label>
    <div class="seg" id="set-theme">
      <button data-v="plum">梅紫</button><button data-v="clay">紅土</button><button data-v="spring">春綠</button><button data-v="sky">晴空</button>
    </div>
  </div>
  <div class="setting"><button class="btn ghost wide" id="set-reset">清除收藏與瀏覽紀錄</button></div>
</aside>

<script src="data/exhibitions.js?v=1790565811"></script>
<script src="app.js"></script>
</body>
</html>
