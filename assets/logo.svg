<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="紅土藝術空間">
  <defs>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2553f"/>
      <stop offset=".55" stop-color="#c0392b"/>
      <stop offset="1" stop-color="#8e2a4d"/>
    </linearGradient>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </defs>
  <g filter="url(#rough)">
    <rect x="10" y="10" width="180" height="180" rx="30" fill="url(#clay)"/>
    <rect x="22" y="22" width="156" height="156" rx="20" fill="none" stroke="#fff6ea" stroke-width="4"/>
  </g>
  <g fill="#fff6ea" font-family="DFKai-SB, BiauKai, KaiTi, 'Kaiti TC', STKaiti, serif" font-weight="700" text-anchor="middle">
    <text x="100" y="98" font-size="70" letter-spacing="2">紅土</text>
    <text x="100" y="146" font-size="34" letter-spacing="4">藝術空間</text>
  </g>
  <g transform="translate(150 40) scale(.26)" opacity=".95">
    <g fill="#f6c7e0"><circle cx="50" cy="24" r="17"/><circle cx="74.7" cy="42" r="17"/><circle cx="65.3" cy="71" r="17"/><circle cx="34.7" cy="71" r="17"/><circle cx="25.3" cy="42" r="17"/></g>
    <circle cx="50" cy="50" r="9" fill="#ffe27a"/>
  </g>
  <text x="100" y="168" fill="#ffd9c7" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" textLength="118" lengthAdjust="spacingAndGlyphs" text-anchor="middle">HONG TU ART SPACE</text>
</svg>
